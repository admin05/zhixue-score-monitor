name: Zhixue connectivity test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Zhixue account and exam list
        env:
          ZHIXUE_COOKIE: ${{ secrets.ZHIXUE_COOKIE }}
        run: node scripts/probe-zhixue.js
